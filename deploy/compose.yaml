services:
  node:
    image: openvpnpa-runtime:0.2.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8443}:8443/tcp"
      - "${NODE_BIND:-0.0.0.0}:${NODE_PORT:-62050}:62050/tcp"
      - "${VPN_PORT:-1194}:1194/udp"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.disable_ipv6: "1"
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ${OPENVPNPA_CONFIG_DIR:-/opt/openvpnpa/config}:/config:ro
      - ${OPENVPNPA_STATE_DIR:-/opt/openvpnpa/state}:/var/lib/openvpnpa
    healthcheck:
      test: [CMD, python, -m, openvpnpa.health]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 30s
